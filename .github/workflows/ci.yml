name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so the release runs the tagged commit's own jobs.
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every JSON document under contract/ parses
        run: |
          set -eu
          count=0
          while IFS= read -r -d '' file; do
            python3 -I -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$file"
            count=$((count+1))
          done < <(find contract -name '*.json' -print0)
          echo "checked $count JSON documents"
      - name: No machine-local paths in tracked text
        run: |
          set -eu
          if git grep -nE '(^|[^A-Za-z0-9_])/(home|tmp)/[A-Za-z0-9_.-]+' -- ':!*.png' ':!*.jpg'; then
            echo 'a machine-local path is in tracked text'; exit 1
          fi
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Every vector against its schema, and the schemas against the Desk's lists
        run: python -m unittest discover -s tests -v

  harness:
    name: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: npm ci
      - name: Build (typecheck every file, tests included, then emit dist/)
        run: npm run build
      - name: Unit tests
        run: npm test

  go:
    # The Go module (go/, ADR-0004): the contract's generated types, every vector round-tripped
    # through them, and the Go certification runner against the TypeScript suite's own scripted
    # server, which is why Node and the locked dependencies are installed too. The spikes under
    # go/spike are formatted here and not built.
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: npm ci
      - name: gofmt
        run: |
          set -eu
          unformatted="$(gofmt -l go)"
          if [ -n "${unformatted}" ]; then
            echo "not gofmt-formatted:"; echo "${unformatted}"; exit 1
          fi
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: The generated types are the generator's output for the schemas
        working-directory: go
        run: |
          set -eu
          go generate ./contract
          git diff --exit-code -- contract
      - name: go test (every vector round-trips; the runner against the shared scripted server)
        working-directory: go
        run: go test -count=1 ./...

  certify:
    # One check per adapter, so branch protection can require each by name.
    name: certify (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [vercel, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: npm ci
      - name: The certification suite against the adapter
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: npm run certify -- --adapter "$ADAPTER"
