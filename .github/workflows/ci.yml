name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every JSON document under contract/ parses
        run: |
          set -eu
          count=0
          while IFS= read -r -d '' file; do
            python3 -I -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$file"
            count=$((count+1))
          done < <(find contract -name '*.json' -print0)
          echo "checked $count JSON documents"
      - name: No machine-local paths in tracked text
        run: |
          set -eu
          if git grep -nE '(^|[^A-Za-z0-9_])/(home|tmp)/[A-Za-z0-9_.-]+' -- ':!*.png' ':!*.jpg'; then
            echo 'a machine-local path is in tracked text'; exit 1
          fi
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Every vector against its schema, and the schemas against the Desk's lists
        run: python -m unittest discover -s tests -v
