name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the devkit's vendored runner). Three jobs
# divide it between them, each check run once: `contract`, which branch protection requires by
# name, runs the four cheap steps on every event; `go-race` runs the race step on a runner of its
# own (#254: it was more than half of the time of one job); `check` sets the toolchains up from the
# manifest and runs every other step, the Desk parity step included. On a pull request `check` and
# `go-race` run the steps jpdev.json maps the changed paths to (`check.sh --changed`), each its own
# part of them; on a push to main and on a dispatch, their whole part of the list.
#
# The release takes main's evidence instead of running this again (docs/ci-evidence.md): each job
# records it with scripts/dev/release_evidence.py (devkit v0.14.0). On a push to main the `check`
# and `go-race` jobs first ask whether the merged pull request's own run already passed some of
# their tree-only checks (`pull_request_reuse` in .github/ci-evidence.json), bound through records
# the pull request cannot write; every refusal runs the job's whole part. JPDEV_BIND_ENV names the
# variables those checks read as flags: check.sh prints their digests, and both runs must have had
# the same values.

on:
  push:
    branches: [main]
  pull_request:
  # Explicit fresh validation on main is the bounded recovery route for missing evidence.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# pull_request_reuse.environment of .github/ci-evidence.json, for every check.sh step of both jobs.
env:
  JPDEV_BIND_ENV: CI,JPDEV_DESK,JP_AGENT_GATEWAY_SOURCE,NODE_OPTIONS,GOFLAGS,GOEXPERIMENT,NODE,DIFF_SEED,DIFF_CASE,JPACK_DIALECT_RUNTIME,JPACK_DIALECT_RUNTIME_MODE,JPACK_DIALECT_EVIDENCE,JP_RUNTIME_BINARY,JP_RUNTIME_BINARY_SHA256,JP_AGENT_GATEWAY_FIXTURE,JP_CORPUS_ROOT,JPS_CHAT_CONTEXT_STORE,JPS_CHAT_CONTEXT_ID,JP_CHECKPOINT_GUARD_ROOT,JP_REASONING_GUARD_ROOT,BODY_PARSER_PROBE_ROOT,UNDICI_PROBE_ROOT,GORACE,GODEBUG,CGO_ENABLED,GOTOOLCHAIN,GOPROXY,GOSUMDB,NODE_ENV,TZ

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - name: Initialize job scratch
        run: |
          set -eu
          scratch="$(mktemp -d "${RUNNER_TEMP}/jpdev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-XXXXXX")"
          mkdir "${scratch}/tmp"
          echo "JPDEV_SCRATCH=${scratch}" >> "$GITHUB_ENV"
          echo "TMPDIR=${scratch}/tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every JSON document under contract/ parses; no machine-local path in tracked text;
      # CLAUDE.md is AGENTS.md; whitespace.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: The cheap steps of dev.json
        run: |
          set -o pipefail
          scripts/dev/check.sh --manifest dev.json --all --only contract,local-paths,agent-docs,diff-check | tee "${{ runner.temp }}/checks.log"

      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job contract --check-log "${{ runner.temp }}/checks.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-ci-contract-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The reuse plan reads the merged pull request, its timeline and its run; nothing is written.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Initialize job scratch
        run: |
          set -eu
          scratch="$(mktemp -d "${RUNNER_TEMP}/jpdev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-XXXXXX")"
          mkdir "${scratch}/tmp"
          echo "JPDEV_SCRATCH=${scratch}" >> "$GITHUB_ENV"
          echo "TMPDIR=${scratch}/tmp" >> "$GITHUB_ENV"
      # The whole history, so that --changed finds the merge base with the base branch, and so that
      # a pull request's evidence names its merge commit's two parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, so that a manifest that does not parse, or that has no `contract` step, fails
      # before the long steps start.
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("go=" + ("true" if "go" in tc else "false"))
          print("goversion=" + tc.get("go", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY
          # The required receipt proof uses the same immutable producer pin locally and in CI.
          python3 - >> "$GITHUB_OUTPUT" <<'PYGATEWAY'
          import json, re
          pin = json.load(open("tests/fixtures/gateway-receipts/source.json", encoding="utf-8"))
          assert pin.get("version") == 1, "Gateway producer pin version is unreadable"
          assert pin.get("repository") == "Judgment-Pack/judgment-pack-gateway", "Gateway producer repository differs"
          assert re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", pin.get("commit") or ""), "Gateway producer commit pin is pending or malformed"
          print("gateway=" + pin["commit"])
          PYGATEWAY
          # The Desk commit scripts/parity.sh was made against, read from the script.
          pin="$(sed -n 's/^desk_pin=\([0-9a-f]\{40\}\)$/\1/p' scripts/parity.sh)"
          [ -n "${pin}" ] || { echo 'scripts/parity.sh has no desk_pin= line of a full commit id' >&2; exit 1; }
          echo "desk=${pin}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.dev.outputs.node != ''
        with:
          node-version: ${{ steps.dev.outputs.node }}
      # The Go release is the manifest's (toolchains.go.version), not a pin here. The Go module's
      # own version, go/go.mod's `go` line, is the lowest the module builds with; CI runs the
      # release the module was measured on (ADR-0004), which is newer.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.dev.outputs.go == 'true'
        with:
          go-version: ${{ steps.dev.outputs.goversion }}
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      # The parity step compares packages/harness with the Desk at the commit the script pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Judgment-Pack/judgment-pack-desk
          ref: ${{ steps.dev.outputs.desk }}
          path: desk-checkout
          fetch-depth: 1
          persist-credentials: false
      - name: Name the checkout for the parity step
        run: echo "JPDEV_DESK=${GITHUB_WORKSPACE}/desk-checkout" >> "$GITHUB_ENV"
      # The receipt runner refuses any dirty or differently pinned Gateway checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Judgment-Pack/judgment-pack-gateway
          ref: ${{ steps.dev.outputs.gateway }}
          path: gateway-checkout
          fetch-depth: 1
          persist-credentials: false
      - name: Name the immutable Gateway producer checkout
        run: echo "JP_AGENT_GATEWAY_SOURCE=${GITHUB_WORKSPACE}/gateway-checkout" >> "$GITHUB_ENV"
      - name: Setup steps
        run: |
          set -o pipefail
          scripts/dev/check.sh --setup | tee "${{ runner.temp }}/setup.log"
      # On main, before the checks: which of this job's tree-only checks the merged pull request's
      # newest run already passed (decision reuse), or none (fresh: a dispatch, a re-run, or any
      # refusal). Either decision passes this step; the capture below reads the plan.
      - name: Plan reuse from the merged pull request
        id: plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/release_evidence.py reuse --workflow ci --job check --output "${{ runner.temp }}/reuse-plan.json"
      # Pull requests select mapped checks; main and a dispatch run the full list. The four steps the
      # contract job runs on every event and the go-race job's step are not run here. Main skips
      # what the plan covered.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          COVERED: ${{ steps.plan.outputs.covered }}
        run: |
          set -o pipefail
          skip=contract,local-paths,agent-docs,diff-check,go-race
          if [ -n "$COVERED" ]; then skip="$skip,$COVERED"; fi
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF" --skip "$skip" | tee "${{ runner.temp }}/checks.log"
          else
            scripts/dev/check.sh --all --skip "$skip" | tee "${{ runner.temp }}/checks.log"
          fi

      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job check --check-log "${{ runner.temp }}/checks.log" --setup-log "${{ runner.temp }}/setup.log" --reuse-plan "${{ runner.temp }}/reuse-plan.json" --output "${{ runner.temp }}/evidence.json"
      # A pull request into main from this repository records what its scoped selection passed, at
      # its merge commit: the evidence a later push to main may reuse. It is never evidence for a
      # release by itself, and a fork's pull request records nothing (the gate never reuses one).
      - name: Record the pull request's checks
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job check --check-log "${{ runner.temp }}/checks.log" --setup-log "${{ runner.temp }}/setup.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-ci-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  # dev.json's go-race step alone: the same command, packages and limits, on a runner of its own
  # (#254). It needs Go, and Node for the scripted server the Eino adapter's tests start; neither the
  # Desk nor the Gateway checkout. Its evidence and its reuse are the job's own, under the same rules
  # as the `check` job's.
  go-race:
    name: go-race
    runs-on: ubuntu-latest
    # The step's own limit in dev.json is 50 minutes.
    timeout-minutes: 60
    # The reuse plan reads the merged pull request, its timeline and its run; nothing is written.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Initialize job scratch
        run: |
          set -eu
          scratch="$(mktemp -d "${RUNNER_TEMP}/jpdev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-XXXXXX")"
          mkdir "${scratch}/tmp"
          echo "JPDEV_SCRATCH=${scratch}" >> "$GITHUB_ENV"
          echo "TMPDIR=${scratch}/tmp" >> "$GITHUB_ENV"
      # The whole history, as in the check job: --changed finds the merge base, and a pull request's
      # evidence names its merge commit's two parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("goversion=" + tc.get("go", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          # Every other step, by name, so that a step added to the manifest never runs in this job.
          steps = [row["name"] for row in m["checks"]] + (["parity"] if "parity" in m else [])
          print("others=" + ",".join(name for name in steps if name != "go-race"))
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.dev.outputs.goversion }}
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
      - name: Setup steps
        run: |
          set -o pipefail
          scripts/dev/check.sh --setup | tee "${{ runner.temp }}/setup.log"
      - name: Plan reuse from the merged pull request
        id: plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/release_evidence.py reuse --workflow ci --job go-race --output "${{ runner.temp }}/reuse-plan.json"
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          COVERED: ${{ steps.plan.outputs.covered }}
          OTHERS: ${{ steps.dev.outputs.others }}
          JPDEV_LOGDIR: ${{ runner.temp }}/logs
        run: |
          set -o pipefail
          skip="$OTHERS"
          if [ -n "$COVERED" ]; then skip="$skip,$COVERED"; fi
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF" --skip "$skip" | tee "${{ runner.temp }}/checks.log"
          else
            scripts/dev/check.sh --all --skip "$skip" | tee "${{ runner.temp }}/checks.log"
          fi

      - name: Each test binary's time
        # check.sh's summary keeps one line of the step's output. What matters is each test binary's
        # time against its own limit, on a runner that can be well over twice as slow as the fastest
        # (#254), so print them, on a failure too, and warn before a binary reaches the limit.
        if: ${{ !cancelled() }}
        env:
          LOG: ${{ runner.temp }}/logs/go-race.log
        run: |
          [ -f "$LOG" ] || exit 0
          grep -E '^(ok|FAIL|panic: test timed out)' "$LOG" || true
          awk '$1 == "ok" && $3 + 0 > 1800 { print "::warning::" $2 " took " $3 ", past three quarters of its 40-minute limit" }' "$LOG"
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job go-race --check-log "${{ runner.temp }}/checks.log" --setup-log "${{ runner.temp }}/setup.log" --reuse-plan "${{ runner.temp }}/reuse-plan.json" --output "${{ runner.temp }}/evidence.json"
      - name: Record the pull request's checks
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job go-race --check-log "${{ runner.temp }}/checks.log" --setup-log "${{ runner.temp }}/setup.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-ci-go-race-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7
