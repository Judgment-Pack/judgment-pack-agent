name: Mutation check

# Each row of packages/harness/scripts/mutation-rows.json breaks one safeguard on purpose, in a scratch
# copy, and a test must fail (agent#37). A row costs a few test files, and the table has more than a
# hundred, so CI time is bounded two ways: a pull request runs the rows whose file it changes, capped,
# and a sample; the full table runs on every push to main, in shards, and weekly and on demand.
# release.yml takes the evidence of the four full shards of a push or dispatch run on main at the
# tagged commit (docs/ci-evidence.md). That every row still applies (each row's text occurs once in
# its file, each test it names exists) is the `mutation-rows` step of dev.json, which the CI `check`
# job runs (on a push to main it may instead reuse the merged pull request's passed result, which
# the release admits again): this workflow does not run it a second time.
on:
  pull_request:
    paths:
      - 'packages/harness/**'
      - '.github/workflows/mutation.yml'
  # No path filter: any commit on main can be tagged, so each one has a full run.
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request push replaces the one before it. A run on main or by dispatch is never
# replaced: a cancelled run would leave its commit without the green table a tag needs.
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sample:
    name: rows of the files this pull request changes, and a sample
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: npm ci
      - name: Build the harness (rows whose tests read dist/)
        run: npm run build
      - name: Rows over the files changed (at most fifteen)
        env:
          BASE: origin/${{ github.base_ref }}
          SEED: ${{ github.event.pull_request.number }}
        run: node packages/harness/scripts/mutation-check.mjs --changed "$BASE" --sample 15 --seed "$SEED"
      - name: Five rows chosen by the pull request's number
        env:
          SEED: ${{ github.event.pull_request.number }}
        run: node packages/harness/scripts/mutation-check.mjs --sample 5 --seed "$SEED"

  full:
    name: every row (shard ${{ matrix.shard }} of 4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: npm ci
      - name: Build the harness (rows whose tests read dist/)
        run: npm run build
      - name: The rows of this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node packages/harness/scripts/mutation-check.mjs --shard "$SHARD/4"

      # Evidence is recorded for a push or a dispatch on main: the weekly schedule run is not
      # evidence (the gate still requires every run at the commit to have finished, and a newer
      # one that failed refuses).
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/dev/release_evidence.py capture --workflow mutation --job full-${{ matrix.shard }} --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-mutation-full-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7
