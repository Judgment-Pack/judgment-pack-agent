name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Node version from dev.json
        id: dev
        run: python3 -c 'import json, os; open(os.environ["GITHUB_OUTPUT"], "a").write("node=" + json.load(open("dev.json"))["toolchains"]["node"]["version"] + "\n")'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.dev.outputs.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check audit reporting and query the registry
        env:
          DEPENDENCY_AUDIT_LIVE: '1'
        run: scripts/dev/check.sh --only dependency-audit,dependency-audit-live
